<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Japan Pathway</title>
<style>
  :root {
    --brand: #0f766e;
    --brand-dark: #115e59;
    --brand-soft: #e6f4f2;
    --accent: #e0475b;
    --warn: #b45309;
    --warn-soft: #fef3c7;
    --info: #1d4ed8;
    --info-soft: #dbeafe;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(248, 250, 252, 0.92);
    backdrop-filter: blur(8px);
  }
  .bar {
    max-width: 600px; margin: 0 auto;
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
    padding: 14px 20px 10px;
  }
  .brand { text-align: center; font-weight: 700; letter-spacing: .02em; color: var(--brand-dark); }
  .brand small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; font-size: 18px; color: var(--text);
  }
  .icon-btn:hover { border-color: var(--brand); }
  .icon-btn[hidden] { display: block; visibility: hidden; }
  .step-count { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .progress { max-width: 560px; margin: 0 auto; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--brand); border-radius: 99px; transition: width .4s ease; }
  .progress-wrap { padding: 0 20px 12px; }
  .progress-wrap[hidden] { display: none; }

  /* ---------- Screen ---------- */
  main { flex: 1; width: 100%; max-width: 600px; margin: 0 auto; padding: 24px 20px 48px; }
  #screen.enter { animation: enter .35s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .q-title { font-size: 26px; line-height: 1.25; font-weight: 750; margin-bottom: 8px; }
  .q-sub { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 24px; }

  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .option {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 16px 18px; text-align: left; font: inherit; color: inherit;
    background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
  }
  .option:hover { border-color: #99d5cd; }
  .option:active { transform: scale(.99); }
  .option.selected { border-color: var(--brand); background: var(--brand-soft); }
  .opt-icon { font-size: 24px; width: 32px; text-align: center; flex-shrink: 0; }
  .opt-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .opt-label { font-weight: 600; font-size: 16px; }
  .opt-sub { font-size: 13px; color: var(--muted); }
  .key {
    font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
    min-width: 24px; height: 24px; display: grid; place-items: center;
  }
  .check {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); flex-shrink: 0;
    display: grid; place-items: center; color: #fff; font-size: 14px;
  }
  .option.selected .check { background: var(--brand); border-color: var(--brand); }
  .option.selected .check::after { content: "✓"; }

  .btn {
    display: block; width: 100%; padding: 16px; font: inherit; font-weight: 700; font-size: 16px;
    border-radius: var(--radius); border: none; cursor: pointer; transition: background .15s, opacity .15s;
    text-align: center; text-decoration: none;
  }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn.secondary { background: var(--card); color: var(--brand-dark); border: 2px solid var(--brand); margin-top: 10px; }
  .btn.big { padding: 18px; font-size: 17px; }

  /* ---------- Intro ---------- */
  .hero { text-align: center; padding-top: 24px; }
  .hero-emoji { font-size: 64px; margin-bottom: 16px; }
  .hero h1 { font-size: 32px; line-height: 1.2; margin-bottom: 12px; }
  .hero p { color: var(--muted); font-size: 17px; line-height: 1.5; margin-bottom: 28px; }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
  .chip { font-size: 13px; padding: 6px 12px; border-radius: 99px; background: var(--brand-soft); color: var(--brand-dark); font-weight: 600; }

  /* ---------- Insight ---------- */
  .insight { text-align: center; }
  .insight .notes, .insight .path, .insight .checklist { text-align: left; }
  .big-emoji { font-size: 56px; margin: 8px 0 12px; }
  .ring { position: relative; width: 150px; height: 150px; margin: 8px auto 20px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring-bg { stroke: var(--line); }
  .ring-fg { stroke: var(--brand); stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 326.7; transition: stroke-dashoffset 1.2s ease; }
  .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; }
  .ring-label small { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .notes { list-style: none; display: flex; flex-direction: column; gap: 10px; margin: 8px 0 28px; }
  .notes li { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 15px; line-height: 1.45; }
  .notes li span:first-child { font-size: 18px; }
  .quote { background: var(--brand-soft); color: var(--brand-dark); border-radius: 12px; padding: 14px 16px; font-size: 15px; line-height: 1.5; margin-bottom: 20px; text-align: left; }

  .path { list-style: none; counter-reset: path; display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .path li { counter-increment: path; display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .path li::before {
    content: counter(path); flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    background: var(--brand); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center;
  }
  .path li:last-child::before { background: var(--accent); }
  .path b { display: block; }
  .path span { font-size: 13px; color: var(--muted); }

  .verdict { border-radius: 12px; padding: 14px 16px; font-size: 15px; line-height: 1.45; margin-bottom: 20px; text-align: left; }
  .verdict.ok { background: var(--brand-soft); color: var(--brand-dark); }
  .verdict.warn { background: var(--warn-soft); color: var(--warn); }
  .timeline { list-style: none; text-align: left; margin: 0 0 28px 8px; border-left: 2px dashed #99d5cd; }
  .timeline li { position: relative; padding: 0 0 22px 24px; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: ""; position: absolute; left: -8px; top: 3px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--card); border: 3px solid var(--brand);
  }
  .timeline li:last-child::before { background: var(--accent); border-color: var(--accent); }
  .tl-date { font-size: 12px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .08em; }
  .tl-text { font-weight: 600; margin-top: 2px; }
  .tl-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .ready-meter { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 4px 0 20px; }
  .ready-meter div { height: 100%; background: var(--brand); border-radius: 99px; width: 0; transition: width 1s ease; }
  .checklist { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .checklist li { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .status { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .status.ok { background: var(--brand-soft); color: var(--brand); }
  .status.todo { background: var(--warn-soft); color: var(--warn); }
  .status.info { background: var(--info-soft); color: var(--info); }
  .checklist b { display: block; font-size: 15px; }
  .checklist span.desc { font-size: 13px; color: var(--muted); line-height: 1.45; }

  /* ---------- Form ---------- */
  .field { display: block; margin-bottom: 16px; }
  .field span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 14px 16px; font: inherit; font-size: 16px;
    border: 2px solid var(--line); border-radius: 12px; background: var(--card); outline: none;
  }
  .field input:focus { border-color: var(--brand); }
  .field.invalid input { border-color: var(--accent); }
  .field .err { display: none; color: var(--accent); font-size: 13px; margin-top: 4px; font-weight: 500; }
  .field.invalid .err { display: block; }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); line-height: 1.45; margin: 4px 0 24px; cursor: pointer; }
  .consent input { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--brand); flex-shrink: 0; }
  .consent.invalid { color: var(--accent); }

  /* ---------- Loading ---------- */
  .loading { text-align: center; padding-top: 32px; }
  .spinner { width: 56px; height: 56px; margin: 0 auto 24px; border: 5px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-list { list-style: none; text-align: left; max-width: 360px; margin: 28px auto 0; display: flex; flex-direction: column; gap: 14px; }
  .load-list li { display: flex; gap: 12px; align-items: center; color: var(--muted); opacity: .4; transition: opacity .3s, color .3s; }
  .load-list li.done { opacity: 1; color: var(--text); }
  .load-list .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: #fff; flex-shrink: 0; }
  .load-list li.done .dot { background: var(--brand); border-color: var(--brand); }
  .load-list li.done .dot::after { content: "✓"; }

  /* ---------- Result ---------- */
  .eyebrow { font-size: 12px; font-weight: 700; color: var(--brand); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 28px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 10px; text-align: center; }
  .stat-val { display: block; font-size: 20px; font-weight: 800; color: var(--brand-dark); }
  .stat-lbl { font-size: 12px; color: var(--muted); }
  h2.section { font-size: 19px; margin: 8px 0 12px; }
  .cta-box { background: var(--brand-dark); color: #fff; border-radius: 18px; padding: 24px; margin-top: 8px; }
  .cta-box h2 { font-size: 22px; margin-bottom: 6px; }
  .cta-box p { color: #cdeae6; font-size: 15px; line-height: 1.5; margin-bottom: 18px; }
  .cta-box .btn.primary { background: #fff; color: var(--brand-dark); }
  .cta-box .btn.primary:hover { background: var(--brand-soft); }
  .cta-box .btn.secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
  .fine { text-align: center; font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.5; }

  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 16px; }
  footer button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; }

  @media (max-width: 420px) {
    .q-title { font-size: 22px; }
    .hero h1 { font-size: 26px; }
    .stat-val { font-size: 17px; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="icon-btn" id="back" aria-label="Back" hidden>←</button>
    <div class="brand" id="brand"></div>
    <div class="step-count" id="stepCount"></div>
  </div>
  <div class="progress-wrap" id="progressWrap" hidden>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</header>

<main><div id="screen"></div></main>

<footer><span id="copy"></span> · <button id="restart">Start over</button></footer>

<script>
/* =========================================================
   CONFIG: edit brand and contact links here
   ========================================================= */
const CONFIG = {
  brand: "Saiko Gakushu",
  tagline: "Study in Japan",
  messengerUrl: "https://www.facebook.com/saikogakushuilc", // e.g. "https://m.me/yourpage". Shows a "Message us" button when set

};

/* =========================================================
   Scoring & tailoring rules
   ========================================================= */
const SCORES = {
  age:       { "18-24": 25, "25-29": 21, "30-34": 12, "35+": 6 },
  education: { college: 25, somecollege: 23, k12: 21, vocational: 18, oldhs: 9 },
  japanese:  { none: 12, basics: 17, n5: 22, n4: 25 },
  hours:     { lt1: 6, "1-2": 16, "2-4": 22, "4+": 25 },
  sponsor:   { parents: 20, ofw: 20, japan: 20, self: 16, unsure: 8 },
};

const NOTES = {
  age: {
    "18-24": ["⭐", "Your age is ideal. Schools love applicants in this range."],
    "25-29": ["⭐", "Your age is a strong fit for most partner schools."],
    "30-34": ["👍", "Some schools accept applicants in their 30s. We'll match you with the right ones."],
    "35+":   ["🧭", "Fewer schools accept applicants 35+, but there are paths. We'll show you which."],
  },
  education: {

    somecollege: ["✅", "Your schooling likely meets the 12-year requirement."],

  },
  japanese: {
    none:   ["🌱", "Starting from zero is normal. Most of our students did too."],
    basics: ["🚀", "Knowing kana already puts you ahead of most beginners."],
    n5:     ["✅", "You already have the Japanese level most schools ask for."],
    n4:     ["🏅", "Your Japanese is above what schools require. Great advantage!"],
  },
  status: {
    student:  ["📖", "You're already in study mode, which makes learning Japanese easier."],
    fulltime: ["💼", "Working full-time? Many of our students prepared on evenings and weekends."],
    parttime: ["🕒", "Part-time work leaves you room to prepare at a steady pace."],
    none:     ["⏳", "Having free time now means you could prepare faster than most."],
  },
};

const MOTIVATION = {
  career:  ["📈", "Japan is hiring", "Japan has a serious worker shortage and has opened more visas for foreign workers. Language school is a common first step in."],
  family:  ["💪", "Helping your family is a powerful reason", "Many students study, work part-time, then move into full-time jobs after graduating, and that's how they support family back home."],
  culture: ["🎌", "Living it beats watching it", "As a student you'll live the culture every day: the food, the seasons, the people. Not just through anime and videos."],

};

const VISION_TEXT = {
  japanese: "speaking Japanese confidently",
  money: "sending money home to your family",
  independent: "living independently in a new country",
  career: "building a career you're proud of",
};

const GOAL_PATH = {
  "study-work": ["Keep growing in Japan", "Extend your studies or move into full-time work"],
  career: ["Start your career in Japan", "Get hired, or qualify for a work / Specified Skilled Worker visa"],
  college: ["Go to college in Japan", "Continue to a senmon gakko (vocational college) or university"],
  unsure: ["Choose your path", "Decide with our guidance once you're in Japan"],
};

const GOAL_NOTES = {
  "study-work": "Study + part-time work (up to 28 hrs/week)",
  career: "Graduate → work visa / Specified Skilled Worker",
  college: "Graduate → senmon gakko or university",
  unsure: "Explore your options once you're there",
};

const WORRY_ANSWERS = {
  cost:     ["💴", "The total cost", "Tuition, dorm and living costs depend on the school and city. We'll give you a full breakdown, including installment options."],
  language: ["🈶", "Learning Japanese", "You'll study before you leave, then attend Japanese classes every weekday at school in Japan. You improve fast when you live in it."],
  visa:     ["📄", "Visa & documents", "We prepare your COE documents with you, and your school files them with Japanese Immigration."],
  job:      ["🏪", "Finding a part-time job", "Student visa holders can work up to 28 hours a week with permission. Many work in convenience stores, restaurants and hotels."],
  family:   ["🏠", "Being away from family", "Most students video call home every day, and you'll meet other Filipino students at school."],
};

const TEMPERATURE = { now: "🔥 Hot", "1mo": "🔥 Hot", "3mo": "Warm", exploring: "Cold" };
const SPONSOR_NAME ={ parents: "your parents", ofw: "your relative abroad", japan: "your relative in Japan" };
const HOURS_LABEL = { lt1: "under 1 hour", "1-2": "1–2 hours", "2-4": "2–4 hours", "4+": "4+ hours" };
const JP_FROM = { none: "zero", basics: "the basics", n5: "N5", n4: "N4+" };

const STUDY_HOURS_TO_N5 = { none: 200, basics: 130, n5: 0, n4: 0 };
const HOURS_PER_DAY = { lt1: 0.75, "1-2": 1.5, "2-4": 3, "4+": 4.5 };
const STUDY_DAYS_PER_MONTH = 26;
const APPLY_LEAD_MONTHS = 5; // COE applications usually close ~5 months before intake

/* =========================================================
   Steps: the funnel, in order. `when` = only show if true.
   ========================================================= */
const STEPS = [
  { type: "intro" },
  {
    type: "question", id: "status", col: "Current status", title: "First, what are you doing right now?",
    options: [
      { v: "student", label: "I'm a student", icon: "📖" },
      { v: "fulltime", label: "Working full-time", icon: "💼" },
      { v: "parttime", label: "Working part-time", icon: "🕒" },
      { v: "none", label: "Not working at the moment", icon: "⏳" },
    ],
  },
  {
    type: "question", id: "age", col: "Age", title: "How old are you?",
    options: [
      { v: "18-24", label: "18–24", icon: "🧑‍🎓" },
      { v: "25-29", label: "25–29", icon: "🧑" },

      { v: "35+", label: "35 or older", icon: "👤" },
    ],
  },
  {
    type: "question", id: "education", col: "Education", title: "What's the highest level of school you've finished?",
    subtitle: "Japanese language schools usually require 12 years of schooling.",
    options: [
      { v: "k12", label: "Senior High School graduate", sub: "Finished Grade 12 (K-12)", icon: "🏫" },
      { v: "oldhs", label: "High School graduate (old curriculum)", sub: "Finished 4th year HS before K-12", icon: "📘" },
      { v: "vocational", label: "Vocational / TESDA course", sub: "After high school", icon: "🛠️" },
      { v: "somecollege", label: "Some college", sub: "Started but didn't finish", icon: "📚" },
      { v: "college", label: "College graduate", sub: "Bachelor's degree or higher", icon: "🎓" },
    ],
  },
  {
    type: "question", id: "willing", col: "Willing to add units", when: a => a.education === "oldhs",
    title: "Would you be willing to take extra units to complete 12 years of schooling?",
    subtitle: "Many applicants do this through a short college or TESDA program.",
    options: [
      { v: "yes", label: "Yes, I'm ready to do it", icon: "💪" },
      { v: "maybe", label: "Maybe, depending on time and cost", icon: "🤔" },
      { v: "info", label: "I'd like to know my options first", icon: "🔎" },
    ],
  },
  {
    type: "question", id: "japanese", col: "Japanese level", title: "How much Japanese do you know?",
    options: [
      { v: "none", label: "None yet", sub: "Starting from zero", icon: "🌱" },
      { v: "basics", label: "The basics", sub: "I can read hiragana / katakana", icon: "あ" },
      { v: "n5", label: "N5 level", sub: "JLPT / NAT N5, or 150+ hours of study", icon: "📗" },
      { v: "n4", label: "N4 or higher", icon: "🏅" },
    ],
  },
  { type: "insight", render: insightFit },
  {
    type: "question", id: "motivation", col: "Motivation", title: "What's drawing you to Japan?",
    options: [
      { v: "career", label: "A better career and salary", icon: "📈" },
      { v: "family", label: "Helping my family", icon: "👨‍👩‍👧" },
      { v: "culture", label: "Japanese culture and lifestyle", icon: "🎌" },
      { v: "abroad", label: "The experience of living abroad", icon: "🌏" },
    ],
  },
  {
    type: "question", id: "vision", col: "Proudest in 1 year", title: "Picture yourself one year after arriving in Japan. What would make you proudest?",
    options: [
      { v: "japanese", label: "Speaking Japanese confidently", icon: "🗣️" },
      { v: "money", label: "Sending money home to my family", icon: "💌" },
      { v: "independent", label: "Living independently in a new country", icon: "🏙️" },
      { v: "career", label: "Building a career I'm proud of", icon: "🏆" },
    ],

const PROGRESS_TYPES = ["question", "form"];

/* =========================================================
   State
   ========================================================= */
const STORAGE_KEY = "jp-pathway-v2";
const $ = (sel, el = document) => el.querySelector(sel);
const screen = $("#screen");
let state = loadState() || freshState();
let advancing = false;
let loadingTimers = [];

function freshState() { return { i: 0, answers: {}, lead: {} }; }
function loadState() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; } }
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function isActive(step) { return !step.when || step.when(state.answers); }
function resolve(v) { return typeof v === "function" ? v(state.answers) : v; }

/* =========================================================
   Navigation
   ========================================================= */
function next() {
  let j = state.i + 1;
  while (j < STEPS.length && !isActive(STEPS[j])) j++;
  if (j < STEPS.length) { state.i = j; render(); }
}
function back() {
  let j = state.i - 1;
  while (j > 0 && (!isActive(STEPS[j]) || STEPS[j].type === "loading")) j--;
  state.i = Math.max(j, 0);
  render();
}
function restart() {
  localStorage.removeItem(STORAGE_KEY);
  state = freshState();
  captureSource();
  render();
}

function render() {
  loadingTimers.forEach(clearTimeout);
  loadingTimers = [];
  advancing = false;
  const step = STEPS[state.i];
  updateChrome(step);
  screen.classList.remove("enter");
  void screen.offsetWidth; // restart animation
  screen.classList.add("enter");
  RENDERERS[step.type](step);
  saveState();
  window.scrollTo(0, 0);
}

function updateChrome(step) {
  const counts = s => isActive(s) && PROGRESS_TYPES.includes(s.type);
  const total = STEPS.filter(counts).length;
  const done = STEPS.slice(0, state.i + 1).filter(counts).length;
  $("#progressWrap").hidden = ["intro", "result", "success"].includes(step.type);
  $("#progressFill").style.width = `${Math.round(done / total * 100)}%`;
  $("#stepCount").textContent = PROGRESS_TYPES.includes(step.type) ? `${done}/${total}` : "";
  $("#back").hidden = ["intro", "loading", "success"].includes(step.type);
}

/* =========================================================
   Interactions
   ========================================================= */
function isSelected(step, v) {
  const a = state.answers[step.id];
  return step.multi ? (a || []).includes(v) : a === v;
}

function choose(step, v, btn) {
  if (step.multi) {
    const set = new Set(state.answers[step.id] || []);
    set.has(v) ? set.delete(v) : set.add(v);
    state.answers[step.id] = [...set];
    btn.classList.toggle("selected");
    $("#next").disabled = set.size === 0;
    saveState();
    return;
  }
  if (advancing) return;
  advancing = true;
  state.answers[step.id] = v;
  screen.querySelectorAll(".option").forEach(b => b.classList.toggle("selected", b === btn));
  saveState();
  setTimeout(next, 280);
}

function submitForm() {
  const name = $("#name").value.trim();
  const email = $("#email").value.trim();
  const mobile = $("#mobile").value.trim();
  const consent = $("#consent").checked;
  const checks = {
    "f-name": name.length >= 2,
    "f-email": /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email),
    "f-mobile": /^(09|\+639)\d{9}$/.test(mobile.replace(/[\s-]/g, "")),
    "f-consent": consent,
  };
  Object.entries(checks).forEach(([id, ok]) => $("#" + id).classList.toggle("invalid", !ok));
  state.lead = { ...state.lead, name, email, mobile, consent };
  saveState();
  if (!Object.values(checks).every(Boolean)) return;
  state.lead.id ||= makeId();
  sendToSheet({ action: "lead", row: leadRow() });
  next();
}

/* =========================================================
   Saving leads to Google Sheets
   ========================================================= */
function leadRow() {
  const a = state.answers;
  const t = timeline();
  const items = readinessItems();
  const row = {
    "Lead ID": state.lead.id,
    "Submitted": "", // filled in by the sheet
    "Temperature": TEMPERATURE[a.commitment] || "",
    "Name": state.lead.name,
    "Email": state.lead.email,
    "Mobile": state.lead.mobile,
    "Match score": `${fitScore(["age", "education", "japanese", "hours", "sponsor"])}%`,
    "Target intake": targetIntake(t).label,
    "Ready steps": `${items.filter(([s]) => s === "ok").length} of ${items.length}`,
    "To-do": items.filter(([s]) => s !== "ok").map(([, title]) => title).join(", "),
  };
  STEPS.filter(s => s.type === "question").forEach(s => {
    const v = isActive(s) ? a[s.id] : null;
    const labelOf = x => resolve(s.options).find(o => o.v === x)?.label || x;
    row[s.col] = v == null ? "" : Array.isArray(v) ? v.map(labelOf).join(", ") : labelOf(v);
  });
  row["Source"] = state.source || "";
  row["Booked consultation"] = "";
  return row;
}

const PENDING_KEY = "jp-pathway-pending";

function sendToSheet(payload) {
  if (!CONFIG.sheetUrl) return;
  fetch(CONFIG.sheetUrl, {
    method: "POST",
    mode: "no-cors", // Apps Script doesn't send CORS headers; the request still goes through
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  }).catch(() => {
    // Offline or blocked: keep it and retry on the next visit
    const pending = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
    pending.push(payload);
    localStorage.setItem(PENDING_KEY, JSON.stringify(pending));
  });
}

function flushPending() {
  const pending = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
  if (!pending.length || !CONFIG.sheetUrl) return;
  localStorage.removeItem(PENDING_KEY);
  pending.forEach(sendToSheet);
}

function captureSource() {
  if (state.source) return;
  const q = new URLSearchParams(location.search);
  const parts = ["utm_source", "utm_medium", "utm_campaign"].map(k => q.get(k)).filter(Boolean);
  if (!parts.length && document.referrer) parts.push(new URL(document.referrer).hostname);
  state.source = parts.join(" / ") || "direct";
}

function makeId() {
  return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

function insightTimeline() {
  const a = state.answers;
  const t = timeline();
  const target = targetIntake(t);
  let verdict;
  if (a.intake === "unsure" || !a.intake) {
    verdict = ["ok", `Your earliest realistic intake is <b>${t.earliest.label}</b>.`];
  } else if (a.intake >= t.earliest.v) {
    verdict = ["ok", `<b>${labelFor(a.intake)}</b> is realistic. You're on track ✅`];
  } else {
    verdict = ["warn", `<b>${labelFor(a.intake)}</b> is tight. We recommend <b>${t.earliest.label}</b> so your application is strong.`];
  }
  return `
    <h1 class="q-title">Here's your estimated timeline 🗓️</h1>
    <p class="q-sub">Studying ${HOURS_LABEL[a.hours]} a day, starting from ${JP_FROM[a.japanese]}.</p>
    <div class="verdict ${verdict[0]}">${verdict[1]}</div>
    ${timelineHtml(t, target)}`;
}

function insightReadiness() {
  const items = readinessItems();
  const ready = items.filter(([s]) => s === "ok").length;
  const pct = Math.round(ready / items.length * 100);
  const headline = ready === items.length ? "You're fully ready to apply! 🎉"
    : ready >= items.length / 2 ? "You're closer than you think 💪"
    : "You've got a clear path forward 🧭";
  return `
    <div class="insight">
      <h1 class="q-title">${headline}</h1>
      <p class="q-sub">You're <b>${ready} of ${items.length}</b> steps ready. Here's what's done and what's next:</p>
      <div class="ready-meter"><div data-w="${Math.max(pct, 4)}%"></div></div>
      ${checklistHtml(items)}
    </div>`;
}

/* =========================================================
   Plan building blocks
   ========================================================= */
function readinessItems() {
  const a = state.answers;
  const t = timeline();
  const items = [];

  if (a.education === "oldhs") {
    items.push(["todo", "Complete 12 years of schooling", a.willing === "yes"
      ? "You're ready to take extra units. We'll find the fastest option."
      : "We'll show you the fastest college or TESDA options."]);
  } else if (a.education === "vocational") {
    items.push(["info", "Schooling requirement", "We'll check whether your TESDA units count toward 12 years."]);
  } else {
    items.push(["ok", "Schooling requirement met", "You have the 12 years of schooling schools ask for."]);
  }

  if (["n5", "n4"].includes(a.japanese)) items.push(["ok", "Japanese level met", "You're at the level schools ask for."]);
  else items.push(["todo", "Reach N5 level", `About ${t.studyMonths} months at your pace, by ${monthYear(t.ready)}.`]);

  items.push({
    yes: ["ok", "Valid passport", "One less thing to worry about."],
    expired: ["todo", "Renew your passport", "DFA appointment slots can fill up, so book your renewal early."],
    processing: ["info", "Passport in progress", "Make sure it arrives before you submit your application."],
    none: ["todo", "Apply for a passport", "Book a DFA appointment soon. You'll need it for your application."],
  }[a.passport] || ["todo", "Passport", "You'll need a valid passport for your application."]);

  if (a.sponsor === "unsure" || !a.sponsor) {
    items.push(["todo", "Choose a financial sponsor", "Immigration needs proof that someone can cover your costs. We'll help you decide."]);
  } else if (a.funds === "both") {
    items.push(["ok", "Strong financial sponsor", "Savings plus steady income is what Immigration looks for."]);
  } else {
    items.push(["todo", "Strengthen your financial proof", "We'll show you the savings target and documents your sponsor needs."]);
  }

  if (a.tried === "refused") items.push(["info", "Learn from your last application", "We'll review what happened so it doesn't repeat."]);
  if (a.tried === "lived") items.push(["info", "Your past stay in Japan", "Tell us about it. We'll check how it affects your new application."]);

  return items;
}

function nextSteps(t, target) {
  const a = state.answers;
  const steps = [];
  if (a.passport === "none" || a.passport === "expired") steps.push(["Book a DFA passport appointment", "Do this first. It's the step most likely to cause delays."]);
  if (a.education === "oldhs") steps.push(["Complete your 12 years of schooling", "Ask us about the fastest college or TESDA options."]);
  if (a.japanese === "none") steps.push(["Start learning hiragana this week", `Then build up to ${HOURS_LABEL[a.hours]} a day${a.status === "fulltime" ? " on evenings and weekends" : ""}.`]);
  else if (a.japanese === "basics") steps.push(["Keep studying toward N5", `${HOURS_LABEL[a.hours]} a day gets you there by ${monthYear(t.ready)}.`]);
  if (a.sponsor === "unsure" || a.funds !== "both") steps.push(["Talk with your family about sponsorship", "Agree on who will sponsor you and start building bank savings."]);
  steps.push(["Book your free consultation", `We'll match you with schools and lock in your ${target.label} plan.`]);
  return steps;
}

function timelineHtml(t, target) {
  const a = state.answers;
  return `
    <ul class="timeline">
      <li><div class="tl-date">Today</div><div class="tl-text">Start your Japanese lessons</div></li>
      <li><div class="tl-date">${t.studyMonths ? monthYear(t.ready) : "Done"}</div>
          <div class="tl-text">${t.studyMonths ? "Reach N5 level" : "Japanese requirement met ✓"}</div>
          ${t.studyMonths ? `<div class="tl-sub">~${t.need} study hours, about ${t.studyMonths} months</div>` : ""}</li>
      <li><div class="tl-date">${monthYear(addMonths(target.date, -APPLY_LEAD_MONTHS))}</div>
          <div class="tl-text">Submit your COE application</div>
          <div class="tl-sub">Your school files it with Japanese Immigration</div></li>
      <li><div class="tl-date">${target.label}</div>
          <div class="tl-text">Fly to Japan ✈️</div>
          <div class="tl-sub">${GOAL_NOTES[a.goal] || GOAL_NOTES.unsure}</div></li>
    </ul>`;
}

function checklistHtml(items) {
  const icon = { ok: "✓", todo: "!", info: "i" };
  return `<ul class="checklist">${items.map(([s, title, desc]) => `
    <li><span class="status ${s}">${icon[s]}</span><div><b>${title}</b><span class="desc">${desc}</span></div></li>`).join("")}</ul>`;
}

/* =========================================================
   Calculations
   ========================================================= */
function fitScore(keys) {
  let sum = 0, max = 0;
  keys.forEach(k => {
    sum += SCORES[k][state.answers[k]] || 0;
    max += Math.max(...Object.values(SCORES[k]));
  });
  return Math.round(sum / max * 100);
}

function timeline() {
  const a = state.answers;
  const need = STUDY_HOURS_TO_N5[a.japanese] ?? 200;
  const perDay = HOURS_PER_DAY[a.hours] ?? 1.5;
  const studyMonths = need === 0 ? 0 : Math.ceil(need / perDay / STUDY_DAYS_PER_MONTH);
  const today = new Date();
  const ready = addMonths(today, studyMonths);
  const docsReady = addMonths(ready, 1); // ~1 month to prepare documents
  const earliest = upcomingIntakes(16).find(x => addMonths(x.date, -APPLY_LEAD_MONTHS) >= docsReady);
  return { need, studyMonths, ready, earliest };
}

function targetIntake(t) {
  const chosen = state.answers.intake;
  if (chosen && chosen !== "unsure" && chosen >= t.earliest.v) return parseIntake(chosen);
  return t.earliest;
}

/* =========================================================
   Date helpers
   ========================================================= */
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const INTAKE_ICON = { 0: "❄️", 3: "🌸", 6: "☀️", 9: "🍁" };

function upcomingIntakes(count) {
  const out = [];
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth() + 2; // skip intakes less than ~2 months away
  while (out.length < count) {
    if (m > 11) { m -= 12; y++; }
    if (m % 3 === 0) out.push(makeIntake(y, m));
    m++;
  }
  return out;
}
function makeIntake(y, m) {
  return { v: `${y}-${String(m + 1).padStart(2, "0")}`, label: `${MONTHS[m]} ${y}`, date: new Date(y, m, 1) };
}
function parseIntake(v) { const [y, m] = v.split("-").map(Number); return makeIntake(y, m - 1); }
function labelFor(v) { return parseIntake(v).label; }
function shortLabel(intake) { return `${MONTHS[intake.date.getMonth()].slice(0, 3)} ${String(intake.date.getFullYear()).slice(2)}`; }
function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }
function monthYear(d) { return `${MONTHS[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`; }

/* =========================================================
   UI helpers
   ========================================================= */
function ringHtml(pct) {
  return `
    <div class="ring" data-pct="${pct}">
      <svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="52"/><circle class="ring-fg" cx="60" cy="60" r="52"/></svg>
      <div class="ring-label"><span><span class="ring-num">0</span>%</span><small>match</small></div>
    </div>`;
}
function animateRing() {
  const ring = $(".ring", screen);
  if (!ring) return;
  const pct = Number(ring.dataset.pct);
  requestAnimationFrame(() => { $(".ring-fg", ring).style.strokeDashoffset = 326.7 * (1 - pct / 100); });
  const num = $(".ring-num", ring);
  const start = performance.now();
  const tick = now => {
    const p = Math.min((now - start) / 1200, 1);
    num.textContent = Math.round(pct * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function firstNameOf(name) { return (name || "").trim().split(/\s+/)[0]; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* =========================================================
   Boot
   ========================================================= */
$("#brand").innerHTML = `${CONFIG.brand}<small>${CONFIG.tagline}</small>`;
$("#copy").textContent = `© ${new Date().getFullYear()} ${CONFIG.brand}`;
$("#back").addEventListener("click", back);
$("#restart").addEventListener("click", restart);

document.addEventListener("keydown", e => {
  if (e.target.matches("input")) { if (e.key === "Enter") $("#next")?.click(); return; }
  if (e.target.matches("button, a") && (e.key === "Enter" || e.key === " ")) return; // native click handles it
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) screen.querySelectorAll(".option")[n - 1]?.click();
  else if (e.key === "Enter") $("#next")?.click();
  else if (e.key === "Backspace" && !$("#back").hidden) back();
});

if (!(state.i >= 0 && state.i < STEPS.length)) state = freshState();
captureSource();
flushPending();
render();
</script>
